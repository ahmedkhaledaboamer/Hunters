<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ذكاء يصنع الفرق في عالم الأعمال · H HUNTERS Technology Solutions</title>

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <!-- Apply saved theme / language before first paint (mirrors preferencesSlice) so there is no flash. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('hh:preferences') || '{}');
        var t = p.theme || 'dark';
        var d = document.documentElement;
        d.classList.toggle('dark', t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        var l = p.locale === 'en' ? 'en' : 'ar';
        d.lang = l;
        d.dir = l === 'ar' ? 'rtl' : 'ltr';
        // Preload the self-hosted fonts this language needs (see @font-face in src/index.css) right away, so the static
        // hero paints in its final font. The build rewrites these paths to the fingerprinted files.
        ['/fonts/jost-latin-var.woff2'].concat(l === 'ar' ? ['/fonts/plex-arabic-300.woff2', '/fonts/plex-arabic-400.woff2'] : []).forEach(function (href) {
          var k = document.createElement('link'); k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2'; k.crossOrigin = 'anonymous'; k.href = href; document.head.appendChild(k);
        });
        // The static hero (inside #root) is the home page's; other pages wait for the app instead of flashing it.
        if (location.pathname !== '/') d.classList.add('no-shell');
      } catch (e) {}
    </script>
    <style>html{background:#000}html:not(.dark){background:#e3e5dc}</style>
    <style>
      .hero-shell{display:none}[lang=ar] .hero-shell-ar,[lang=en] .hero-shell-en{display:block}
      .no-shell .hero-shell{display:none!important}
      /* Loader: the brand's node-and-line motif along the top edge. Covers nothing, so it costs nothing in speed. */
      #hh-loader{position:fixed;inset-inline:0;top:0;z-index:200;height:2px;pointer-events:none;transition:opacity .4s ease .15s}
      #hh-loader i{position:absolute;inset-block:0;inset-inline-start:0;width:100%;background:linear-gradient(90deg,transparent,#d7f71e);transform-origin:left;transform:scaleX(0);animation:hh-draw 2.6s cubic-bezier(.1,.7,.2,1) forwards}
      #hh-loader b{position:absolute;top:50%;inset-inline-start:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#d7f71e;box-shadow:0 0 12px 3px rgb(215 247 30/.65);animation:hh-node 2.6s cubic-bezier(.1,.7,.2,1) forwards}
      [dir=rtl] #hh-loader i{transform-origin:right;background:linear-gradient(270deg,transparent,#d7f71e)}
      [dir=rtl] #hh-loader b{margin:-4px -4px 0 0}
      #hh-loader.done i{animation:none;transform:scaleX(1);transition:transform .3s ease}
      #hh-loader.done b{animation:none;inset-inline-start:100%;transition:inset-inline-start .3s ease}
      #hh-loader.done{opacity:0}
      @keyframes hh-draw{to{transform:scaleX(.85)}}
      @keyframes hh-node{to{inset-inline-start:85%}}
      @media (prefers-reduced-motion:reduce){#hh-loader{display:none}}
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  <body>
    <div id="hh-loader" aria-hidden="true"><i></i><b></b></div>
    <script>
      (function () {
        var el = document.getElementById('hh-loader');
        function done() { el.classList.add('done'); setTimeout(function () { el.remove(); }, 800); }
        if (document.readyState === 'complete') done(); else window.addEventListener('load', done, { once: true });
      })();
    </script>

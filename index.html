<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نعيد هندسة الأعمال لعصر الذكاء الاصطناعي · H HUNTERS Technology Solutions</title>
    <meta name="description" content="اتش هانترز لحلول التكنولوجيا — شركة حلول البرمجيات والذكاء الاصطناعي في أبوظبي، الإمارات." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <!-- Apply saved theme / language before first paint (mirrors preferencesSlice) so there is no flash. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('hh:preferences') || '{}');
        var t = p.theme || 'dark';
        var d = document.documentElement;
        d.classList.toggle('dark', t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        var l = p.locale === 'en' ? 'en' : 'ar';
        d.lang = l;
        d.dir = l === 'ar' ? 'rtl' : 'ltr';
        // Preload the self-hosted fonts this language needs (see @font-face in src/index.css) right away, so the static
        // hero paints in its final font. The build rewrites these paths to the fingerprinted files.
        ['/fonts/jost-latin-var.woff2'].concat(l === 'ar' ? ['/fonts/plex-arabic-300.woff2', '/fonts/plex-arabic-400.woff2'] : []).forEach(function (href) {
          var k = document.createElement('link'); k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2'; k.crossOrigin = 'anonymous'; k.href = href; document.head.appendChild(k);
        });
        // The static hero (inside #root) is the home page's; other pages wait for the app instead of flashing it.
        if (location.pathname !== '/') d.classList.add('no-shell');
        if (sessionStorage.getItem('hh:intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('pl-off');
        else d.classList.add('pl-active');
      } catch (e) {}
    </script>
    <style>html{background:#000}html:not(.dark){background:#e3e5dc}</style>
    <style>
      #preloader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .5s ease}
      html:not(.dark) #preloader{background:#e3e5dc}
      .pl-off #preloader{display:none}
      .hero-shell{display:none}[lang=ar] .hero-shell-ar,[lang=en] .hero-shell-en{display:block}
      .no-shell .hero-shell{display:none!important}
      html.pl-active{overflow:hidden}
      #preloader.pl-done{opacity:0;pointer-events:none}
      .pl-mark{width:72px;height:auto;animation:pl-in .6s ease both,pl-pulse 1.6s ease-in-out .6s infinite}
      .pl-mark *{fill:#d7f71e}
      html:not(.dark) .pl-mark *{stroke:#1a1a1a;stroke-width:1.5;paint-order:stroke}
      .pl-line{position:absolute;inset-inline:0;bottom:0;height:2px;background:rgb(128 128 128/.2)}
      #pl-bar{display:block;height:100%;background:#d7f71e;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
      [dir=rtl] #pl-bar{transform-origin:right}
      @keyframes pl-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
      @keyframes pl-pulse{50%{opacity:.55}}
    </style>
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_AE" />
    <meta property="og:locale:alternate" content="en_AE" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

  <body>
    <noscript><style>#preloader{display:none}</style></noscript>
    <div id="preloader" aria-hidden="true">
      <svg class="pl-mark" viewBox="0 0 112 100">
        <rect x="34" y="4" width="15" height="92" rx="7.5" />
        <rect x="76" y="6" width="15" height="86" rx="7.5" />
        <rect x="16" y="43" width="90" height="13" rx="3" />
        <circle cx="13" cy="49.5" r="10" />
      </svg>
      <div class="pl-line"><span id="pl-bar"></span></div>
    </div>
    <script>
      (function () {
        var root = document.documentElement;
        var el = document.getElementById('preloader');
        if (!el || root.classList.contains('pl-off')) { if (el) el.remove(); window.__hhReady = function () {}; return; }
        var bar = document.getElementById('pl-bar');
        var p = 0, ready = false, start = performance.now(), MIN = 600;
        var tick = setInterval(function () {
          p = Math.min(ready ? 1 : 0.9, p + Math.max(0.01, ((ready ? 1 : 0.9) - p) * 0.08)); // creep to 90% until the app is ready
          bar.style.transform = 'scaleX(' + p + ')';
          if (ready && p >= 0.995 && performance.now() - start >= MIN) { clearInterval(tick); finish(); }
        }, 30);
        function finish() {
          try { sessionStorage.setItem('hh:intro', '1'); } catch (e) {}
          el.classList.add('pl-done');
          root.classList.remove('pl-active');
          setTimeout(function () { el.remove(); }, 600);
        }
        // The static hero underneath is real content, so the intro only waits for it to be in its final fonts
        // (or for the app, whichever comes first) — never for the whole app.
        window.__hhReady = function () { ready = true; };
        if (document.fonts && document.fonts.load) {
          var ar = root.lang === 'ar';
          Promise.all((ar ? ['300 1em "IBM Plex Sans Arabic"', '400 1em "IBM Plex Sans Arabic"'] : ['200 1em Jost', '400 1em Jost']).map(function (f) { return document.fonts.load(f, ar ? 'ع' : 'a'); })).then(window.__hhReady, window.__hhReady);
        }
        setTimeout(window.__hhReady, 2500);
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <h1>H HUNTERS Technology Solutions</h1>
      <p>Software &amp; AI solutions company in Abu Dhabi, United Arab Emirates. Please enable JavaScript to view this site.</p>

  </body>
